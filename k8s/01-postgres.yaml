apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        sku VARCHAR(50) UNIQUE NOT NULL,
        name VARCHAR(120) NOT NULL,
        category VARCHAR(80) NOT NULL,
        quantity INTEGER NOT NULL DEFAULT 0 CHECK (quantity >= 0),
        min_stock INTEGER NOT NULL DEFAULT 5,
        unit_price NUMERIC(10, 2) NOT NULL DEFAULT 0.00,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    CREATE TABLE IF NOT EXISTS inventory_events (
        id SERIAL PRIMARY KEY,
        product_sku VARCHAR(50) NOT NULL,
        event_type VARCHAR(30) NOT NULL,
        delta INTEGER NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO products (sku, name, category, quantity, min_stock, unit_price)
    VALUES 
        ('SKU-001', 'Servidor Rack 1U', 'Infraestructura', 12, 3, 1250.00),
        ('SKU-002', 'Switch Gigabit 24P', 'Redes', 4, 5, 320.00),
        ('SKU-003', 'Patch Cord Cat6 2m', 'Cableado', 85, 20, 4.50)
    ON CONFLICT (sku) DO NOTHING;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "inv_user"
            - name: POSTGRES_PASSWORD
              value: "inv_pass_2026"
            - name: POSTGRES_DB
              value: "inventory_db"
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
