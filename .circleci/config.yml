version: 2.1

jobs:
  build-and-deploy:
    docker:
      - image: cimg/base:2024.02
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build & Push Docker Images
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            
            docker build -t $DOCKER_USER/inventory-backend:$CIRCLE_SHA1 ./backend
            docker build -t $DOCKER_USER/inventory-backend:latest ./backend
            docker push $DOCKER_USER/inventory-backend:$CIRCLE_SHA1
            docker push $DOCKER_USER/inventory-backend:latest

            docker build -t $DOCKER_USER/inventory-frontend:$CIRCLE_SHA1 ./frontend
            docker build -t $DOCKER_USER/inventory-frontend:latest ./frontend
            docker push $DOCKER_USER/inventory-frontend:$CIRCLE_SHA1
            docker push $DOCKER_USER/inventory-frontend:latest

      - run:
          name: Instalar kubectl y Desplegar en Kubernetes
          command: |
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && sudo mv kubectl /usr/local/bin/

            mkdir -p ~/.kube
            echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config

            kubectl apply -f k8s/
            kubectl set image deployment/backend backend=$DOCKER_USER/inventory-backend:$CIRCLE_SHA1
            kubectl set image deployment/frontend frontend=$DOCKER_USER/inventory-frontend:$CIRCLE_SHA1
            kubectl rollout status deployment/backend
            kubectl rollout status deployment/frontend

workflows:
  version: 2
  ci-cd-pipeline:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main
