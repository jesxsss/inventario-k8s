version: 2.1

jobs:
  build-and-deploy:
    docker:
      - image: cimg/base:2024.02
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build & Push Docker Images
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

            docker build -t $DOCKER_USER/inventory-backend:$CIRCLE_SHA1 ./backend
            docker build -t $DOCKER_USER/inventory-backend:latest ./backend
            docker push $DOCKER_USER/inventory-backend:$CIRCLE_SHA1
            docker push $DOCKER_USER/inventory-backend:latest

            docker build -t $DOCKER_USER/inventory-frontend:$CIRCLE_SHA1 ./frontend
            docker build -t $DOCKER_USER/inventory-frontend:latest ./frontend
            docker push $DOCKER_USER/inventory-frontend:$CIRCLE_SHA1
            docker push $DOCKER_USER/inventory-frontend:latest

      - run:
          name: Instalar kubectl y Desplegar en Kubernetes
          command: |
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && sudo mv kubectl /usr/local/bin/

            mkdir -p ~/.kube
            echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config

            kubectl apply --validate=false --request-timeout=60s -f k8s/
            kubectl set image deployment/backend backend=$DOCKER_USER/inventory-backend:$CIRCLE_SHA1 --request-timeout=60s
            kubectl set image deployment/frontend frontend=$DOCKER_USER/inventory-frontend:$CIRCLE_SHA1 --request-timeout=60s

            for deploy in postgres backend frontend prometheus grafana; do
              echo "Verificando despliegue de $deploy..."
              READY="0"
              for i in $(seq 1 18); do
                READY=$(kubectl get deploy $deploy -o jsonpath='{.status.readyReplicas}' --request-timeout=30s 2>/dev/null || echo "0")
                if [ "$READY" = "1" ]; then
                  echo "$deploy listo (1/1)"
                  break
                fi
                sleep 10
              done
              if [ "$READY" != "1" ]; then
                echo "Error: $deploy no alcanzo el estado Ready en 180s"
                kubectl get pods --request-timeout=30s || true
                exit 1
              fi
            done

            kubectl get pods --request-timeout=30s

workflows:
  version: 2
  ci-cd-pipeline:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main
